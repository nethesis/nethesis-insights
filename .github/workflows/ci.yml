name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"

      # Fails fast: a missing header is a < 1s check, no reason to wait out
      # the build and the race-detected test suite to learn about it.
      - name: license headers
        run: ./scripts/check-license-headers.sh

      - name: build
        run: make build

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race -count=1

      # .golangci.yml uses the v2 config schema ("version: \"2\""), which
      # only a v2.x golangci-lint engine understands -- pin a v2 release,
      # matching the version this repo's tooling was validated against.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.3
