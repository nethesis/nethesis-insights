{{define "content"}}
<h1>Cost</h1>
<p><small>Fleet-wide LLM spend and token totals, grouped by UTC day and model. Each day
sums the analyses across every system for that day (see <code>/analyses</code> for
per-system detail, <code>/gate</code> for why calls happened at all).</small></p>
<figure class="overflow-auto">
<table class="striped">
<thead>
<tr>
<th scope="col">Day</th><th scope="col">Model</th><th scope="col" class="num">Windows</th><th scope="col" class="num">LLM calls</th>
<th scope="col" class="num">In tok</th><th scope="col" class="num">Out tok</th><th scope="col" class="num">Cost</th>
</tr>
</thead>
<tbody>
{{range .Days}}
{{$day := .Day}}
{{range .Rows}}
<tr>
<td class="mono">{{$day}}</td>
<td class="mono">{{.Model}}</td>
<td class="num">{{.Windows}}</td>
<td class="num">{{.LLMCalls}}</td>
<td class="num">{{.InputTokens}}</td>
<td class="num">{{.OutputTokens}}</td>
<td class="num">{{fmtCost .CostMicros}}</td>
</tr>
{{end}}
<tr>
<td class="mono"><strong>{{$day}} total</strong></td>
<td></td><td></td><td></td><td></td><td></td>
<td class="num"><strong>{{fmtCost .TotalCostMicros}}</strong></td>
</tr>
{{else}}
<tr><td colspan="7">no spend yet</td></tr>
{{end}}
</tbody>
{{if .Days}}
<tfoot>
<tr>
<td><strong>Grand total</strong></td>
<td></td><td></td><td></td><td></td><td></td>
<td class="num"><strong>{{fmtCost .GrandTotalCostMicros}}</strong></td>
</tr>
</tfoot>
{{end}}
</table>
</figure>
{{end}}
