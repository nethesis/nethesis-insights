{{define "content"}}
<h1>Systems</h1>
<p><small>One row per machine that has ever sent a bundle, with fleet-wide totals for it:
known templates, currently-open findings, all-time findings, analyzed windows, LLM calls
and spend. Use it to spot which systems are actually costing money or generating
findings.</small></p>
<figure class="overflow-auto">
<table class="striped">
<thead>
<tr>
<th scope="col">System</th><th scope="col">Tenant</th><th scope="col">Collector</th><th scope="col">First seen</th><th scope="col">Last seen</th>
<th scope="col" class="num">Templates</th><th scope="col" class="num">Open</th><th scope="col" class="num">Findings</th>
<th scope="col" class="num">Windows</th><th scope="col" class="num">LLM calls</th><th scope="col" class="num">Cost</th>
</tr>
</thead>
<tbody>
{{range .Systems}}
<tr>
<td class="mono">{{.SystemID}}</td>
<td>{{.TenantID}}</td>
<td>{{.CollectorVersion}}</td>
<td class="mono">{{fmtTime .FirstSeen}}</td>
<td class="mono" title="{{fmtTime .LastSeen}}">{{fmtAgo .LastSeen}}</td>
<td class="num">{{.Templates}}</td>
<td class="num">{{.OpenFindings}}</td>
<td class="num">{{.Findings}}</td>
<td class="num">{{.Windows}}</td>
<td class="num">{{.LLMCalls}}</td>
<td class="num">{{fmtCost .CostMicros}}</td>
</tr>
{{else}}
<tr><td colspan="11">no systems yet</td></tr>
{{end}}
</tbody>
</table>
</figure>
{{end}}
