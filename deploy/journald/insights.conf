#
# Install to /etc/systemd/journald.conf.d/insights.conf, then
# `systemctl restart systemd-journald`.
#
# Five containers log to journald: Traefik with `accessLog: {}` (one line
# per proxied request) and four Go binaries with one slog line per request
# each, so a single client request can produce five journal entries. With
# nothing set, journald's default ceiling is 10% of the filesystem and it
# will happily spend it -- on a 1.7 GiB box with no swap, filling the disk
# is the failure that takes everything else down with it.
#
# This is host-wide, which is correct only because that host runs this
# deployment and nothing else. Do not install it on a shared NS8 node.

[Journal]
SystemMaxUse=200M
# Without a per-file ceiling journald rotates in ~50M chunks here, so a
# burst can discard a quarter of the retained history at once.
SystemMaxFileSize=20M
